name: API Integration Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Build solution
        run: dotnet build ShoppingMicroServicesApp.sln --configuration Release

      - name: Start Web APIs
        run: |
          ASPNETCORE_URLS="http://localhost:5064" dotnet run --project UsersWebAPI/UsersWebAPI.csproj --no-build -c Release &
          ASPNETCORE_URLS="http://localhost:5074" dotnet run --project PaymentWebAPI/PaymentWebAPI.csproj --no-build -c Release &
          ASPNETCORE_URLS="http://localhost:5121" dotnet run --project OrdersWebAPI/OrdersWebAPI.csproj --no-build -c Release &
          sleep 10

      - name: Run Newman tests
        run: newman run postman/collection.json -e postman/environment.json --insecure
